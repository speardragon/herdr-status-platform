<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 우리반 에이전트 — herdr status</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141a;
    font: 13px/1.5 'Apple SD Gothic Neo', system-ui, sans-serif; color: #dfe6ec; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }

  /* 상단 바 — 보조 오버레이 */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; flex-wrap: wrap;
    gap: 8px 14px; align-items: center; padding: 10px 14px; pointer-events: none;
    background: linear-gradient(rgba(10, 13, 18, 0.72), rgba(10, 13, 18, 0)); }
  header a { color: #9ec3ff; text-decoration: none; pointer-events: auto; }
  header .title { font-weight: 800; letter-spacing: 0.02em; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5a6472; margin-right: 5px; }
  .dot.up { background: #3fb950; box-shadow: 0 0 6px #3fb95088; }
  .chip { padding: 2px 10px; border-radius: 11px; background: rgba(23, 29, 38, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.07); }
  .chip b { font-weight: 800; }
  .chip.working b { color: #4fd487; } .chip.idle b { color: #9aa7b4; }
  .chip.blocked b { color: #ff6a5c; } .chip.done b { color: #f5c453; }

  /* 이벤트 피드 — 좌하단, 3D를 가리지 않게 반투명 */
  #feed { position: fixed; left: 12px; bottom: 12px; z-index: 5; width: min(300px, 40vw);
    max-height: 26vh; overflow: hidden; display: flex; flex-direction: column; gap: 3px;
    pointer-events: none; mask-image: linear-gradient(#000 62%, transparent); }
  #feed .ev { padding: 4px 10px; border-radius: 7px; background: rgba(14, 18, 24, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.05); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; font-size: 12px; }
  #feed .t { color: #7d8794; margin-right: 7px; font-size: 11px; }
  #feed .agent_status_changed { color: #9be2b3; }
  #feed .agent_appeared, #feed .workspace_opened { color: #9ec3ff; }
  #feed .agent_left, #feed .workspace_closed { color: #f0a56e; }
  #feed .source_disconnected { color: #ff6a5c; }

  /* 호버 툴팁 */
  #tip { position: fixed; z-index: 9; max-width: 340px; padding: 8px 12px; border-radius: 9px;
    background: rgba(13, 17, 23, 0.94); border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); pointer-events: none; opacity: 0;
    transition: opacity 0.12s; font-size: 12.5px; }
  #tip.show { opacity: 1; }
  #tip .tt { font-weight: 800; margin-bottom: 2px; }
  #tip .mut { color: #8d99a6; font-weight: 400; }

  #hint { position: fixed; bottom: 12px; right: 14px; z-index: 5; color: #97a3b1; font-size: 12px;
    background: rgba(14, 18, 24, 0.6); padding: 4px 12px; border-radius: 9px; pointer-events: none; }

  #fallback { position: fixed; inset: 0; z-index: 20; display: none; place-items: center;
    background: #10141a; text-align: center; line-height: 2; }
</style>
</head>
<body>
  <div id="stage"></div>

  <header>
    <a href="/">← 갤러리</a>
    <span class="title">🎓 3D 우리반 에이전트</span>
    <span><span class="dot" id="dot-ws"></span>ws</span>
    <span><span class="dot" id="dot-src"></span><span id="src-label">source</span></span>
    <span class="chip">학생 <b id="c-total">0</b></span>
    <span class="chip working">공부중 <b id="c-working">0</b></span>
    <span class="chip idle">조는중 <b id="c-idle">0</b></span>
    <span class="chip blocked">질문 <b id="c-blocked">0</b></span>
    <span class="chip done">완료 <b id="c-done">0</b></span>
  </header>

  <div id="feed"></div>
  <div id="tip"></div>
  <div id="hint">학생 클릭 = herdr pane 점프 · 마우스로 둘러보기</div>
  <div id="fallback"><div>😢 WebGL을 사용할 수 없는 환경이에요.<br>하드웨어 가속을 켜거나 다른 브라우저로 열어주세요.</div></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
