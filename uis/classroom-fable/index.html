<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리반 에이전트 — herdr status</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="classroom">
    <div id="backwall">
      <a id="gallery-link" href="/">📌 ← 갤러리</a>
      <div class="window w1"><span class="mini-sun"></span><span class="mini-cloud"></span></div>
      <div id="corkboard">
        <div class="paper timetable">
          <b>시간표</b>
          <span>1교시 코딩</span><span>2교시 테스트</span><span>3교시 리뷰</span>
        </div>
        <div class="paper doodle">🖍️ 🐛→✅</div>
      </div>
      <div id="motto">급훈 · 막히면 손을 들자 ✋</div>
      <div id="clock">
        <svg viewBox="0 0 60 60" aria-hidden="true">
          <circle cx="30" cy="30" r="27" class="clk-face"/>
          <line x1="30" y1="7" x2="30" y2="11" class="clk-tick"/>
          <line x1="30" y1="49" x2="30" y2="53" class="clk-tick"/>
          <line x1="7" y1="30" x2="11" y2="30" class="clk-tick"/>
          <line x1="49" y1="30" x2="53" y2="30" class="clk-tick"/>
          <line id="clk-h" x1="30" y1="30" x2="30" y2="18" class="clk-hand h"/>
          <line id="clk-m" x1="30" y1="30" x2="30" y2="12" class="clk-hand m"/>
          <circle cx="30" cy="30" r="2" class="clk-pin"/>
        </svg>
      </div>
      <div class="window w2"><span class="mini-cloud c2"></span></div>
    </div>

    <div id="seats">
      <div id="empty-hint" hidden>🏫 교실이 텅 비었어요 — 학생(에이전트)들의 등교를 기다리는 중…</div>
    </div>

    <div id="desk">
      <span class="desk-label">📋 출석부</span>
      <span class="chip st-working">✏️ 공부 중 <b id="c-working">0</b></span>
      <span class="chip st-idle">💤 엎드림 <b id="c-idle">0</b></span>
      <span class="chip st-blocked">✋ 질문 <b id="c-blocked">0</b></span>
      <span class="chip st-done">💯 다 풀음 <b id="c-done">0</b></span>
      <span class="desk-props">☕ 🖍️ 📐</span>
      <span class="conn"><span id="conn-emoji">⏳</span> <span id="conn-label">연결 중…</span></span>
    </div>
  </main>

  <aside id="journal">
    <button id="journal-toggle" type="button">📔 알림장 <span class="fold">▾</span></button>
    <ol id="journal-list"></ol>
  </aside>

  <div id="offline-banner" hidden>📵 교무 방송이 끊겼어요 — 마지막으로 본 교실입니다</div>
  <div id="fx-layer"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
