<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Agent Homeroom 3D — herdr status</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
<style>
  :root {
    --glass: rgba(17, 24, 27, .72);
    --line: rgba(255, 255, 255, .14);
    --muted: #aab5b2;
    --working: #57e4a0;
    --idle: #8db6d8;
    --blocked: #ff5d63;
    --done: #f7c85a;
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    margin: 0;
    min-width: 320px;
    overflow: hidden;
    color: #f7faf9;
    background: #18211f;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }

  #stage { position: fixed; inset: 0; isolation: isolate; }
  #stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 52% 47%, transparent 44%, rgba(10, 14, 13, .2) 100%),
      linear-gradient(180deg, rgba(10, 17, 15, .14), transparent 26%, transparent 72%, rgba(9, 13, 12, .24));
    mix-blend-mode: multiply;
  }
  canvas { display: block; width: 100%; height: 100%; outline: none; }

  .hud { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
  .glass {
    border: 1px solid var(--line);
    background: var(--glass);
    box-shadow: 0 16px 44px rgba(0, 0, 0, .22), inset 0 1px rgba(255, 255, 255, .05);
    -webkit-backdrop-filter: blur(15px) saturate(1.15);
    backdrop-filter: blur(15px) saturate(1.15);
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 214px;
    padding: 10px 14px 10px 10px;
    border-radius: 14px;
  }
  .room-mark {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 239, 187, .4);
    border-radius: 10px;
    background: linear-gradient(145deg, #4a6b52, #253e32);
    color: #fff1bd;
    font: 900 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .04em;
  }
  .brand small, .live small {
    display: block;
    color: var(--muted);
    font: 700 8px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .brand b { display: block; margin-top: 5px; font-size: 14px; letter-spacing: .035em; }

  .stats {
    display: flex;
    align-items: stretch;
    min-width: 0;
    border-radius: 14px;
    overflow: hidden;
  }
  .stat {
    width: 92px;
    display: grid;
    grid-template-columns: 10px 1fr;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-right: 1px solid var(--line);
  }
  .stat:last-child { border-right: 0; }
  .stat i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 13px var(--c); }
  .stat span { color: #bcc6c3; font-size: 8px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .stat b { display: block; margin-top: 1px; color: var(--c); font: 900 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .stat.working { --c: var(--working); }
  .stat.idle { --c: var(--idle); }
  .stat.blocked { --c: var(--blocked); }
  .stat.done { --c: var(--done); }
  body.has-blocked .stat.blocked { animation: alert 1.05s ease-in-out infinite; background: rgba(255, 44, 55, .13); }

  .live {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 118px;
    padding: 10px 13px;
    border-radius: 14px;
  }
  .live-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #68716f;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, .04);
  }
  .live-dot.up { background: var(--working); box-shadow: 0 0 0 4px rgba(87, 228, 160, .12), 0 0 15px var(--working); }
  .live b { display: block; margin-top: 4px; font: 850 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .09em; }

  .feed {
    width: min(410px, calc(100vw - 28px));
    position: absolute;
    left: max(14px, env(safe-area-inset-left));
    bottom: max(14px, env(safe-area-inset-bottom));
    padding: 11px 13px 9px;
    border-radius: 14px;
  }
  .feed-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; color: #dce5e2; font-size: 9px; font-weight: 850; letter-spacing: .12em; }
  .feed-head span:last-child { color: #87928f; font: 700 8px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .event-list { display: grid; gap: 2px; }
  .event {
    display: grid;
    grid-template-columns: 48px 7px minmax(0, 1fr);
    align-items: center;
    gap: 7px;
    min-height: 20px;
    color: #c7d0cd;
    font-size: 9px;
  }
  .event time { color: #788481; font: 700 8px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .event i { width: 6px; height: 6px; border-radius: 50%; background: #84908d; }
  .event strong { overflow: hidden; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
  .event.blocked i { background: var(--blocked); box-shadow: 0 0 9px var(--blocked); }
  .event.working i { background: var(--working); }
  .event.done i { background: var(--done); }
  .event.idle i { background: var(--idle); }

  .help {
    position: absolute;
    right: max(14px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom));
    padding: 10px 13px;
    border-radius: 12px;
    color: #b8c3bf;
    font-size: 9px;
    font-weight: 720;
    letter-spacing: .04em;
  }
  .help b { color: #eff5f3; }

  .tooltip {
    max-width: min(320px, calc(100vw - 24px));
    position: fixed;
    z-index: 8;
    padding: 11px 13px;
    border: 1px solid rgba(255, 255, 255, .17);
    border-radius: 11px;
    opacity: 0;
    transform: translate3d(0, 5px, 0);
    background: rgba(14, 20, 19, .9);
    box-shadow: 0 14px 30px rgba(0, 0, 0, .25);
    color: #dde6e3;
    pointer-events: none;
    transition: opacity .13s ease, transform .13s ease;
  }
  .tooltip.show { opacity: 1; transform: none; }
  .tooltip b { display: block; margin-bottom: 4px; color: #fff; font-size: 11px; }
  .tooltip span { display: block; color: #a7b3af; font-size: 9px; line-height: 1.55; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: max(68px, calc(env(safe-area-inset-bottom) + 68px));
    z-index: 9;
    padding: 10px 16px;
    border: 1px solid rgba(255, 255, 255, .18);
    border-radius: 999px;
    opacity: 0;
    transform: translate(-50%, 12px);
    background: rgba(13, 20, 18, .9);
    color: #f3f8f6;
    box-shadow: 0 14px 34px rgba(0,0,0,.25);
    font-size: 10px;
    font-weight: 800;
    pointer-events: none;
    transition: .22s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .loading {
    position: fixed;
    inset: 0;
    z-index: 7;
    display: grid;
    place-items: center;
    background: #1a2421;
    color: #cad5d1;
    font: 800 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .15em;
    transition: opacity .55s ease, visibility .55s;
  }
  .loading::before {
    content: "";
    width: 34px;
    height: 34px;
    position: absolute;
    border: 2px solid rgba(255,255,255,.1);
    border-top-color: #77d9a7;
    border-radius: 50%;
    transform: translateY(-34px);
    animation: spin .9s linear infinite;
  }
  .loading.out { opacity: 0; visibility: hidden; }

  @keyframes spin { to { transform: translateY(-34px) rotate(360deg); } }
  @keyframes alert { 50% { box-shadow: inset 0 0 20px rgba(255, 71, 78, .28); } }

  @media (max-width: 760px) {
    .topbar { align-items: flex-start; }
    .brand { min-width: 0; }
    .brand small { display: none; }
    .brand b { margin-top: 0; font-size: 11px; }
    .room-mark { width: 32px; height: 32px; }
    .stats { position: absolute; top: 52px; left: 0; }
    .stat { width: 70px; padding: 8px 9px; }
    .live { min-width: 0; }
    .live small { display: none; }
    .feed { bottom: 12px; }
    .help { display: none; }
  }

  @media (max-width: 480px) {
    .brand { padding-right: 10px; }
    .brand b { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stat { width: 61px; grid-template-columns: 7px 1fr; gap: 5px; padding-inline: 7px; }
    .stat span { font-size: 7px; }
    .live { padding: 10px; }
    .feed { padding-block: 8px 6px; }
    .event:nth-child(n+4) { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
  <main id="stage" aria-label="실시간 3D 에이전트 교실">
    <div class="loading" id="loading">3D CLASSROOM PREPARING</div>
  </main>

  <div class="hud" aria-live="polite">
    <div class="topbar">
      <div class="brand glass">
        <div class="room-mark">3D<br>LAB</div>
        <div><small>HERDR OBSERVATION DECK</small><b>AGENT HOMEROOM</b></div>
      </div>
      <div class="stats glass" aria-label="에이전트 상태 집계">
        <div class="stat working"><i></i><div><span>Working</span><b id="working-count">0</b></div></div>
        <div class="stat idle"><i></i><div><span>Idle</span><b id="idle-count">0</b></div></div>
        <div class="stat blocked"><i></i><div><span>Blocked</span><b id="blocked-count">0</b></div></div>
        <div class="stat done"><i></i><div><span>Done</span><b id="done-count">0</b></div></div>
      </div>
      <div class="live glass">
        <span class="live-dot" id="live-dot"></span>
        <div><small id="source-label">CONNECTING</small><b id="clock">--:--:--</b></div>
      </div>
    </div>

    <section class="feed glass" aria-label="최근 교실 이벤트">
      <div class="feed-head"><span>CLASSROOM ACTIVITY</span><span id="seq">SEQ —</span></div>
      <div class="event-list" id="event-list"></div>
    </section>
    <div class="help glass"><b>학생을 클릭</b>해 해당 pane으로 이동 · 마우스를 움직여 둘러보기</div>
  </div>

  <div class="tooltip" id="tooltip"></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="./classroom3d.js"></script>
</body>
</html>
