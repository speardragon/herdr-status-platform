<!doctype html>
<!-- 갤러리 셸 — /api/uis 매니페스트로 카드 그리드를 그린다. 디자인은 나중에 갈아엎는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>herdr status — 갤러리</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐑</text></svg>">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0f1115; color: #d7dce2; font-family: -apple-system, system-ui, 'Apple SD Gothic Neo', sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.5px; }
  h1 small { font-size: 13px; color: #6d7681; font-weight: 400; margin-left: 10px; }
  #live { margin: 10px 0 30px; color: #8b949e; font-size: 13px; font-variant-numeric: tabular-nums; }
  #live .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 6px; }
  #live .dot.up { background: #3fb950; }
  #live b { color: #d7dce2; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  a.card { display: block; background: #151922; border: 1px solid #232833; border-radius: 12px; padding: 20px; text-decoration: none; color: inherit; transition: transform 0.12s, border-color 0.12s; }
  a.card:hover { transform: translateY(-3px); border-color: #3a4356; }
  .card .emoji { font-size: 34px; }
  .card h3 { margin: 12px 0 6px; font-size: 16px; }
  .card p { margin: 0; font-size: 13px; color: #8b949e; line-height: 1.5; }
  #empty { color: #6d7681; font-size: 14px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🐑 herdr status<small>병렬 에이전트 관전 플랫폼</small></h1>
    <div id="live"><span class="dot" id="dot"></span><span id="live-text">연결 중…</span></div>
    <div class="grid" id="grid"></div>
    <p id="empty" hidden>아직 UI가 없어요. <code>uis/&lt;이름&gt;/</code>에 <code>ui.json</code> + <code>index.html</code>을 만들면 카드가 생겨요.</p>
  </div>

<script type="module">
import { connect } from '/sdk.js';

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const res = await fetch('/api/uis');
const { data: uis = [] } = await res.json();
document.getElementById('grid').innerHTML = uis.map((ui) => `
  <a class="card" href="${esc(ui.path)}">
    <div class="emoji">${esc(ui.emoji)}</div>
    <h3>${esc(ui.title)}</h3>
    <p>${esc(ui.description)}</p>
  </a>`).join('');
document.getElementById('empty').hidden = uis.length > 0;

const client = connect();
const dot = document.getElementById('dot');
const text = document.getElementById('live-text');
client.onUpdate(({ snapshot: s }) => {
  dot.classList.toggle('up', s.connected);
  const blocked = s.stats.blocked ? ` · 🔴 블록 <b>${s.stats.blocked}</b>` : '';
  text.innerHTML = `${s.source} · 에이전트 <b>${s.stats.total}</b> · 작업중 <b>${s.stats.working}</b>${blocked} · seq ${s.seq}`;
});
client.onTransport((up) => { if (!up) { dot.classList.remove('up'); text.textContent = '서버 연결 끊김 — 재접속 중…'; } });
</script>
</body>
</html>
